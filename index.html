<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeployFlow Pro Max 🚀</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI';
  background: linear-gradient(-45deg, #1e3a8a, #0f172a, #2563eb);
  background-size: 400% 400%;
  animation: gradient 10s ease infinite;
  color: white;
}

@keyframes gradient {
  0% {background-position: 0%;}
  50% {background-position: 100%;}
  100% {background-position: 0%;}
}

.sidebar {
  width: 200px;
  height: 100vh;
  background: #020617;
  position: fixed;
  padding: 20px;
}

.sidebar h2 {
  color: #38bdf8;
}

.sidebar p {
  cursor: pointer;
  padding: 10px;
}

.main {
  margin-left: 220px;
  padding: 20px;
}

.container {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  flex: 1;
  min-width: 300px;
  background: rgba(30,41,59,0.8);
  padding: 20px;
  border-radius: 15px;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
}

input, select {
  padding: 10px;
  margin: 5px;
}

button {
  padding: 10px;
  background: #38bdf8;
  border: none;
  cursor: pointer;
}

li {
  list-style: none;
  background: #334155;
  margin: 5px;
  padding: 10px;
  border-radius: 5px;
  display: flex;
  justify-content: space-between;
}

.high { border-left: 5px solid red; }
.medium { border-left: 5px solid orange; }
.low { border-left: 5px solid green; }

.progress {
  height: 10px;
  background: gray;
  border-radius: 5px;
  overflow: hidden;
}

.progress-bar {
  height: 10px;
  background: #38bdf8;
  width: 0%;
}

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: black;
  padding: 10px;
  border-radius: 5px;
  display: none;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>DeployFlow 🚀</h2>
<p>Dashboard</p>
<p>Tasks</p>
<p>Deployments</p>
</div>

<div class="main">

<h1>DeployFlow Pro Max 🚀</h1>

<div class="container">

<div class="card">
<h3>Task Manager</h3>

<input id="taskInput" placeholder="Task">
<select id="priority">
<option value="low">Low</option>
<option value="medium">Medium</option>
<option value="high">High</option>
</select>

<button onclick="addTask()">Add</button>

<ul id="taskList"></ul>

<h4>Progress</h4>
<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

</div>

<div class="card">
<h3>Deployment Panel</h3>

<p>Version: <span id="version">v3.0</span></p>
<p>Build Time: <span id="time"></span></p>
<p>Status: <span id="status">Deploying...</span></p>
<p>Deploy Count: <span id="count">0</span></p>

<button onclick="simulateDeploy()">Simulate Deploy</button>

</div>

</div>

</div>

<div class="toast" id="toast"></div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let count = localStorage.getItem("count") || 0;

function showToast(msg) {
  let t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=> t.style.display="none", 2000);
}

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask() {
  let text = taskInput.value;
  let priority = document.getElementById("priority").value;

  if (!text) return;

  tasks.push({text, done:false, priority});
  taskInput.value="";
  save();
  render();
  showToast("Task Added 🚀");
}

function toggleTask(i) {
  tasks[i].done = !tasks[i].done;
  save();
  render();
}

function deleteTask(i) {
  tasks.splice(i,1);
  save();
  render();
}

function render() {
  let list = document.getElementById("taskList");
  list.innerHTML = "";

  let done = 0;

  tasks.forEach((t,i)=>{
    if(t.done) done++;

    list.innerHTML += `
    <li class="${t.priority}">
      <span onclick="toggleTask(${i})">${t.text}</span>
      <button onclick="deleteTask(${i})">❌</button>
    </li>`;
  });

  let percent = tasks.length ? (done/tasks.length)*100 : 0;
  document.getElementById("progressBar").style.width = percent+"%";
}

function simulateDeploy() {
  count++;
  localStorage.setItem("count", count);
  document.getElementById("count").innerText = count;

  document.getElementById("status").innerText = "Deploying...";
  setTimeout(()=>{
    document.getElementById("status").innerText = "Live ✅";
    showToast("Deployment Successful 🎉");
  },2000);
}

document.getElementById("time").innerText = new Date().toLocaleString();

render();
</script>

</body>
</html>
