<!DOCTYPE html>
<html>
<head>
<title>DeployFlow Dashboard 🚀</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI';
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  color: white;
}

/* HEADER */
.header {
  padding: 20px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}

/* LAYOUT */
.container {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 20px;
  flex-wrap: wrap;
}

/* CARDS */
.card {
  width: 400px;
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 15px rgba(0,0,0,0.5);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

/* BUTTON */
button {
  padding: 10px 15px;
  background: #38bdf8;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 10px;
}

button:hover {
  background: #0ea5e9;
}

/* LIST */
ul {
  padding-left: 20px;
}

li {
  margin: 8px 0;
}

/* STATUS */
.green { color: lightgreen; }
.red { color: red; }
</style>
</head>

<body>

<div class="header">
DeployFlow Dashboard 🚀
</div>

<div class="container">

<!-- DEPLOYMENTS -->
<div class="card">
<h2>🚀 Deployments</h2>

<button onclick="deploy()">Trigger Deployment</button>

<ul id="deployList"></ul>
</div>

<!-- JENKINS -->
<div class="card">
<h2>⚙️ Jenkins Status</h2>

<p>Status: <span id="status"></span></p>
<p>Jobs: <span id="jobs"></span></p>

</div>

</div>

<script>
const API = "http://localhost:5000/api";

async function loadDeployments() {
  const res = await fetch(API + "/deployments");
  const data = await res.json();

  let list = document.getElementById("deployList");
  list.innerHTML = "";

  data.forEach(d => {
    list.innerHTML += `
      <li>
        <b>${d.version}</b> - 
        <span class="green">${d.status}</span> - 
        ${d.time}
      </li>`;
  });
}

async function deploy() {
  await fetch(API + "/deploy", { method: "POST" });
  loadDeployments();
}

async function loadJenkins() {
  const res = await fetch(API + "/jenkins");
  const data = await res.json();

  document.getElementById("status").innerText = data.status;
  document.getElementById("jobs").innerText = data.jobs;

  if (data.status === "Connected") {
    document.getElementById("status").className = "green";
  } else {
    document.getElementById("status").className = "red";
  }
}

setInterval(() => {
  loadDeployments();
  loadJenkins();
}, 3000);

loadDeployments();
loadJenkins();
</script>

</body>
</html>
