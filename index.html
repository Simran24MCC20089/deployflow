<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeployFlow Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI';
  background: #0b1e2d;
  color: white;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  height: 100vh;
  background: #020617;
  position: fixed;
  padding: 20px;
}

.sidebar h2 {
  color: #38bdf8;
}

.sidebar p {
  padding: 12px;
  cursor: pointer;
  border-radius: 6px;
}

.sidebar p:hover {
  background: #1e293b;
}

/* MAIN */
.main {
  margin-left: 240px;
  padding: 20px;
}

/* CARD */
.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

/* BUTTON */
button {
  padding: 10px;
  background: #38bdf8;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.green { color: lightgreen; }
.red { color: red; }

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

td, th {
  padding: 10px;
  border-bottom: 1px solid #333;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>DeployFlow</h2>
<p>Dashboard</p>
<p>Deployments</p>
<p>System</p>
<p>Logs</p>
</div>

<div class="main">

<h2>Deployment Trends</h2>

<div class="card">
<canvas id="chart"></canvas>
</div>

<h2>Deployment History</h2>

<div class="card">
<table>
<tr>
<th>Version</th>
<th>Status</th>
<th>Time</th>
</tr>
<tbody id="deployList"></tbody>
</table>
</div>

<h2>System Status</h2>

<div class="card">
<p>Server: <span class="green">Running</span></p>
<p>Docker: <span class="green">Active</span></p>
<p>Jenkins: <span id="jenkinsStatus"></span></p>

<button onclick="deploy()">Trigger Deployment</button>
</div>

</div>

<script>
const API = "http://localhost:5000/api";

let chart = new Chart(document.getElementById("chart"), {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      label: "Deployments",
      data: [],
      borderColor: "cyan"
    }]
  }
});

/* LOAD DEPLOYMENTS */
async function loadDeployments() {
  const res = await fetch(API + "/deployments");
  const data = await res.json();

  let table = document.getElementById("deployList");
  table.innerHTML = "";

  data.forEach((d,i) => {
    table.innerHTML += `
      <tr>
        <td>${d.version}</td>
        <td class="green">${d.status}</td>
        <td>${d.time}</td>
      </tr>`;
  });

  chart.data.labels = data.map((_,i)=>i+1);
  chart.data.datasets[0].data = data.map((_,i)=>i+1);
  chart.update();
}

/* DEPLOY */
async function deploy() {
  await fetch(API + "/deploy", { method: "POST" });
  loadDeployments();
}

/* JENKINS */
async function loadJenkins() {
  const res = await fetch(API + "/jenkins");
  const data = await res.json();

  document.getElementById("jenkinsStatus").innerText = data.status;
}

/* AUTO REFRESH */
setInterval(()=>{
  loadDeployments();
  loadJenkins();
},3000);

loadDeployments();
loadJenkins();
</script>

</body>
</html>
