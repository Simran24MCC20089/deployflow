<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeployFlow DevOps System</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI';
  background: #0b1e2d;
  color: white;
  transition: 0.3s;
}

.light {
  background: #f1f5f9;
  color: black;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  padding: 15px 20px;
  background: #06141f;
}

.navbar button {
  padding: 5px 10px;
}

/* SIDEBAR */
.sidebar {
  width: 200px;
  height: 100vh;
  background: #020617;
  position: fixed;
  padding: 20px;
}

.sidebar p {
  cursor: pointer;
  padding: 10px;
}

.sidebar p:hover {
  background: #1e293b;
}

/* MAIN */
.main {
  margin-left: 220px;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 20px;
}

.hidden { display:none; }

.green { color: lightgreen; }
.red { color: red; }

table {
  width: 100%;
}

td, th {
  padding: 8px;
}
</style>
</head>

<body>

<div class="navbar">
<h2>DeployFlow</h2>
<button onclick="toggleTheme()">Toggle Theme</button>
</div>

<div class="sidebar">
<p onclick="show('dashboard')">Dashboard</p>
<p onclick="show('jenkins')">Jenkins Jobs</p>
<p onclick="show('logs')">Logs</p>
</div>

<div class="main">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="card">
<h3>Total Deployments: <span id="count"></span></h3>
<h3>Jenkins: <span id="jenkinsStatus"></span></h3>
</div>

<div class="card">
<canvas id="chart"></canvas>
</div>
</div>

<!-- JENKINS JOBS -->
<div id="jenkins" class="hidden">
<div class="card">
<h2>Jenkins Job List</h2>
<table>
<tr><th>Name</th><th>Status</th></tr>
<tbody id="jobs"></tbody>
</table>
</div>
</div>

<!-- LOGS -->
<div id="logs" class="hidden">
<div class="card">
<h2>Activity Logs</h2>
<ul id="logList"></ul>
</div>
</div>

</div>

<script>
const API = "http://localhost:5000/api";

/* NAVIGATION */
function show(page) {
  document.querySelectorAll(".main > div").forEach(d=>d.classList.add("hidden"));
  document.getElementById(page).classList.remove("hidden");
}

/* THEME */
function toggleTheme() {
  document.body.classList.toggle("light");
}

/* CHART */
let chart = new Chart(document.getElementById("chart"), {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      label: "Deployments",
      data: [],
      borderColor: "cyan"
    }]
  }
});

/* LOAD DEPLOYMENTS */
async function loadDeployments() {
  const res = await fetch(API + "/deployments");
  const data = await res.json();

  document.getElementById("count").innerText = data.length;

  chart.data.labels = data.map((_,i)=>i+1);
  chart.data.datasets[0].data = data.map((_,i)=>i+1);
  chart.update();
}

/* JENKINS STATUS */
async function loadJenkins() {
  const res = await fetch(API + "/jenkins");
  const data = await res.json();

  document.getElementById("jenkinsStatus").innerText = data.status;
}

/* JENKINS JOBS */
async function loadJobs() {
  const res = await fetch(API + "/jenkins/jobs");
  const data = await res.json();

  let table = document.getElementById("jobs");
  table.innerHTML = "";

  data.forEach(job=>{
    table.innerHTML += `
    <tr>
      <td>${job.name}</td>
      <td class="${job.color.includes('blue')?'green':'red'}">
        ${job.color}
      </td>
    </tr>`;
  });
}

/* LOGS */
async function loadLogs() {
  const res = await fetch(API + "/logs");
  const data = await res.json();

  let list = document.getElementById("logList");
  list.innerHTML = "";

  data.forEach(l=>{
    list.innerHTML += `<li>${l.message}</li>`;
  });
}

/* AUTO REFRESH */
setInterval(()=>{
  loadDeployments();
  loadJenkins();
  loadJobs();
  loadLogs();
},3000);

loadDeployments();
loadJenkins();
loadJobs();
loadLogs();
</script>

</body>
</html>
