<!DOCTYPE html>
<html>
<head>
<title>DeployFlow Ultimate 🚀</title>

<style>
body { font-family: Arial; background: #0f172a; color: white; }
.container { display: flex; gap: 20px; flex-wrap: wrap; }
.card { background: #1e293b; padding: 20px; border-radius: 10px; }
button { padding: 10px; margin: 5px; }
</style>
</head>

<body>

<h1>DeployFlow Ultimate Dashboard 🚀</h1>

<div class="container">

<div class="card">
<h3>Deployments</h3>
<button onclick="deploy()">Trigger Deploy</button>
<ul id="deployList"></ul>
</div>

<div class="card">
<h3>Jenkins Status</h3>
<p>Status: <span id="jenkinsStatus"></span></p>
<p>Jobs: <span id="jobs"></span></p>
</div>

</div>

<script>
const API = "http://localhost:5000/api";

// Load deployments
async function loadDeployments() {
    const res = await fetch(API + "/deployments");
    const data = await res.json();

    let list = document.getElementById("deployList");
    list.innerHTML = "";

    data.forEach(d => {
        list.innerHTML += `<li>${d.version} - ${d.status} - ${d.time}</li>`;
    });
}

// Trigger deploy
async function deploy() {
    await fetch(API + "/deploy", { method: "POST" });
    loadDeployments();
}

// Jenkins status
async function loadJenkins() {
    const res = await fetch(API + "/jenkins");
    const data = await res.json();

    document.getElementById("jenkinsStatus").innerText = data.status;
    document.getElementById("jobs").innerText = data.jobs;
}

// Auto refresh
setInterval(() => {
    loadDeployments();
    loadJenkins();
}, 3000);

loadDeployments();
loadJenkins();
</script>

</body>
</html>
