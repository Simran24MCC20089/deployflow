<meta charset="UTF-8">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeployFlow DevOps Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI';
  background: #0b1e2d;
  color: white;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  height: 100vh;
  background: #06141f;
  position: fixed;
  padding: 20px;
}

.sidebar h2 {
  color: #38bdf8;
}

.sidebar p {
  padding: 10px;
  cursor: pointer;
  border-radius: 6px;
}

.sidebar p:hover {
  background: #1e293b;
}

/* MAIN */
.main {
  margin-left: 240px;
  padding: 20px;
}

/* TOP CARDS */
.cards {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

.card {
  flex: 1;
  min-width: 180px;
  background: #122b3c;
  padding: 20px;
  border-radius: 12px;
}

.card h3 {
  margin: 0;
}

/* CHART */
.chart {
  margin-top: 20px;
  background: #122b3c;
  padding: 20px;
  border-radius: 12px;
}

/* TABLE */
table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
}

td, th {
  padding: 10px;
  border-bottom: 1px solid #333;
}

.green { color: lightgreen; }
.red { color: red; }

button {
  padding: 8px;
  background: #38bdf8;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>DeployFlow</h2>
<p>Dashboard</p>
<p>Deployments</p>
<p>Kubernetes</p>
<p>Logs</p>
<p>Settings</p>
</div>

<div class="main">

<h1>DevOps Monitoring Dashboard</h1>

<!-- KPI CARDS -->
<div class="cards">
<div class="card">
<h3 id="builds">0</h3>
<p>Total Deployments</p>
</div>

<div class="card">
<h3 id="success">100%</h3>
<p>Success Rate</p>
</div>

<div class="card">
<h3>Running</h3>
<p>Kubernetes Pods</p>
</div>

<div class="card">
<h3 id="jenkinsStatus">--</h3>
<p>Jenkins Status</p>
</div>
</div>

<!-- CHART -->
<div class="chart">
<h3>Deployment Trends</h3>
<canvas id="chart"></canvas>
</div>

<!-- TABLE -->
<h3>Deployment History</h3>
<table>
<tr>
<th>Version</th>
<th>Status</th>
<th>Time</th>
</tr>
<tbody id="deployList"></tbody>
</table>

<br>
<button onclick="deploy()">Trigger Deployment</button>

</div>

<script>
const API = "http://localhost:5000/api";

let chart = new Chart(document.getElementById("chart"), {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      label: "Deployments",
      data: [],
      borderColor: "cyan"
    }]
  }
});

async function loadDeployments() {
  const res = await fetch(API + "/deployments");
  const data = await res.json();

  document.getElementById("builds").innerText = data.length;

  let success = data.filter(d => d.status==="Success").length;
  let rate = data.length ? Math.round((success/data.length)*100) : 100;
  document.getElementById("success").innerText = rate + "%";

  let table = document.getElementById("deployList");
  table.innerHTML = "";

  data.forEach(d => {
    table.innerHTML += `
    <tr>
      <td>${d.version}</td>
      <td class="${d.status==='Success'?'green':'red'}">${d.status}</td>
      <td>${d.time}</td>
    </tr>`;
  });

  chart.data.labels = data.map((_,i)=>i+1);
  chart.data.datasets[0].data = data.map((_,i)=>i+1);
  chart.update();
}

async function deploy() {
  await fetch(API + "/deploy", { method: "POST" });
  loadDeployments();
}

async function loadJenkins() {
  const res = await fetch(API + "/jenkins");
  const data = await res.json();

  document.getElementById("jenkinsStatus").innerText = data.status;
}

setInterval(()=>{
  loadDeployments();
  loadJenkins();
},3000);

loadDeployments();
loadJenkins();
</script>

</body>
</html>
