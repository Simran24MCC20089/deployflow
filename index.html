<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeployFlow Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI';
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  color: white;
}

/* HEADER */
.header {
  text-align: center;
  padding: 20px;
  font-size: 28px;
  font-weight: bold;
}

/* LAYOUT */
.container {
  display: flex;
  gap: 20px;
  padding: 20px;
  flex-wrap: wrap;
}

/* CARD */
.card {
  flex: 1;
  min-width: 300px;
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
}

/* BUTTON */
button {
  padding: 10px;
  background: #38bdf8;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #0ea5e9;
}

.green { color: lightgreen; }
.red { color: red; }

canvas {
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
DeployFlow Dashboard
</div>

<div class="container">

<!-- DEPLOYMENTS -->
<div class="card">
<h2>Deployments</h2>

<button onclick="deploy()">Trigger Deployment</button>

<ul id="deployList"></ul>
</div>

<!-- JENKINS -->
<div class="card">
<h2>Jenkins Status</h2>

<p>Status: <span id="status"></span></p>
<p>Jobs: <span id="jobs"></span></p>
</div>

<!-- LINE CHART -->
<div class="card">
<h2>Deployment Trend</h2>
<canvas id="lineChart"></canvas>
</div>

<!-- PIE CHART -->
<div class="card">
<h2>Success Ratio</h2>
<canvas id="pieChart"></canvas>
</div>

</div>

<script>
const API = "http://localhost:5000/api";

let lineChart = new Chart(document.getElementById("lineChart"), {
  type: 'line',
  data: {
    labels: [],
    datasets: [{
      label: "Deployments",
      data: [],
      borderColor: "cyan"
    }]
  }
});

let pieChart = new Chart(document.getElementById("pieChart"), {
  type: 'doughnut',
  data: {
    labels: ["Success", "Failed"],
    datasets: [{
      data: [1,0],
      backgroundColor: ["lime","red"]
    }]
  }
});

async function loadDeployments() {
  const res = await fetch(API + "/deployments");
  const data = await res.json();

  let list = document.getElementById("deployList");
  list.innerHTML = "";

  let success = 0;

  data.forEach((d,i) => {
    list.innerHTML += `<li>${d.version} - ${d.status} - ${d.time}</li>`;
    if(d.status==="Success") success++;
  });

  // update charts
  lineChart.data.labels = data.map((_,i)=>i+1);
  lineChart.data.datasets[0].data = data.map((_,i)=>i+1);
  lineChart.update();

  pieChart.data.datasets[0].data = [success, data.length-success];
  pieChart.update();
}

async function deploy() {
  await fetch(API + "/deploy", { method: "POST" });
  loadDeployments();
}

async function loadJenkins() {
  const res = await fetch(API + "/jenkins");
  const data = await res.json();

  document.getElementById("status").innerText = data.status;
  document.getElementById("jobs").innerText = data.jobs;

  document.getElementById("status").className =
    data.status==="Connected" ? "green" : "red";
}

setInterval(()=>{
  loadDeployments();
  loadJenkins();
},3000);

loadDeployments();
loadJenkins();
</script>

</body>
</html>
