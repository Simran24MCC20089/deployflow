<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DeployFlow Pro 🚀</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a, #1e3a8a);
  color: white;
  text-align: center;
  transition: 0.3s;
}

.light {
  background: #f1f5f9;
  color: black;
}

h1 {
  color: #38bdf8;
}

.container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  backdrop-filter: blur(10px);
  background: rgba(30,41,59,0.8);
  padding: 20px;
  border-radius: 15px;
  width: 320px;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
}

input {
  padding: 10px;
  width: 65%;
  border-radius: 5px;
}

button {
  padding: 10px;
  border-radius: 5px;
  cursor: pointer;
  background: #38bdf8;
  border: none;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.1);
}

li {
  list-style: none;
  margin: 8px;
  padding: 8px;
  background: #334155;
  border-radius: 5px;
  display: flex;
  justify-content: space-between;
}

.completed {
  text-decoration: line-through;
  color: gray;
}

.stats {
  margin-top: 10px;
  font-size: 14px;
}

.toggle {
  position: absolute;
  top: 20px;
  right: 20px;
}
</style>
</head>

<body>

<button class="toggle" onclick="toggleTheme()">🌙</button>

<h1>DeployFlow Pro 🚀</h1>

<div class="container">

<div class="card">
<h3>📌 Task Manager</h3>

<input id="taskInput" placeholder="Enter task">
<button onclick="addTask()">Add</button>

<br><br>
<input id="search" placeholder="Search..." onkeyup="renderTasks()">

<div>
<button onclick="filterTasks('all')">All</button>
<button onclick="filterTasks('completed')">Completed</button>
<button onclick="filterTasks('pending')">Pending</button>
</div>

<ul id="taskList"></ul>

<div class="stats">
Total: <span id="total"></span> |
Completed: <span id="completed"></span> |
Pending: <span id="pending"></span>
</div>

</div>

<div class="card">
<h3>📊 Deployment Info</h3>

<p><b>Version:</b> <span id="version">v2.0</span></p>
<p><b>Last Updated:</b> <span id="time"></span></p>
<p><b>Status:</b> <span id="status">Deploying...</span></p>
<p><b>Live Clock:</b> <span id="clock"></span></p>

</div>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
let filter = "all";

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addTask() {
  let input = document.getElementById("taskInput");
  if (!input.value) return alert("Enter task!");

  tasks.push({ text: input.value, done: false });
  input.value = "";
  save();
  renderTasks();

  alert("Task Added ✅");
}

function deleteTask(i) {
  tasks.splice(i, 1);
  save();
  renderTasks();
}

function toggleTask(i) {
  tasks[i].done = !tasks[i].done;
  save();
  renderTasks();
}

function filterTasks(f) {
  filter = f;
  renderTasks();
}

function renderTasks() {
  let list = document.getElementById("taskList");
  let search = document.getElementById("search").value.toLowerCase();
  list.innerHTML = "";

  let filtered = tasks.filter(t => {
    if (filter === "completed") return t.done;
    if (filter === "pending") return !t.done;
    return true;
  }).filter(t => t.text.toLowerCase().includes(search));

  filtered.forEach((t, i) => {
    list.innerHTML += `
    <li class="${t.done ? 'completed' : ''}">
      <span onclick="toggleTask(${i})">${t.text}</span>
      <button onclick="deleteTask(${i})">❌</button>
    </li>`;
  });

  document.getElementById("total").innerText = tasks.length;
  document.getElementById("completed").innerText = tasks.filter(t=>t.done).length;
  document.getElementById("pending").innerText = tasks.filter(t=>!t.done).length;
}

// Theme toggle
function toggleTheme() {
  document.body.classList.toggle("light");
}

// Deployment simulation
setTimeout(()=>{
  document.getElementById("status").innerText = "Live ✅";
}, 2000);

// Time
document.getElementById("time").innerText = new Date().toLocaleString();

setInterval(()=>{
  document.getElementById("clock").innerText = new Date().toLocaleTimeString();
},1000);

// Auto refresh (simulate CI/CD)
setTimeout(()=>{
  location.reload();
}, 20000);

renderTasks();
</script>

</body>
</html>
